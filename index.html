<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal AI OS v2.0-alpha</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header class="page-header">
<h1>Personal AI OS</h1>
<p class="sub">捕获想法，完成下一步。</p>
</header>

<section aria-labelledby="dashboard-title">
<div class="section-heading">
<h2 id="dashboard-title">今日驾驶舱</h2>
<span id="today-date" class="muted"></span>
</div>
<form id="goal-form">
<label for="goal">今日主线</label>
<textarea id="goal" placeholder="今天最重要的一件事" rows="2"></textarea>
<button type="submit">保存主线</button>
</form>
<p id="goal-status" class="status" aria-live="polite"></p>
<div class="summary-grid" aria-label="任务概览">
<div><strong id="todo-count">0</strong><span>待完成</span></div>
<div><strong id="completed-count">0</strong><span>已完成</span></div>
<div><strong id="capture-count">0</strong><span>待处理捕获</span></div>
</div>
<div class="dashboard-columns">
<div>
<h3>今日任务</h3>
<div id="today-tasks" class="compact-list"></div>
</div>
<div>
<h3>最近记录</h3>
<div id="recent-records" class="compact-list"></div>
</div>
</div>
</section>

<section aria-labelledby="capture-title">
<div class="section-heading">
<h2 id="capture-title">捕获箱</h2>
<span class="muted">先记录，后整理</span>
</div>
<form id="capture-form">
<label for="capture-content">快速记录</label>
<textarea id="capture-content" placeholder="记录一个想法、待办或线索" required></textarea>
<div class="form-row">
<label>分类<select id="capture-category"><option value="idea">想法</option><option value="task">任务</option><option value="note">笔记</option><option value="decision">决策</option><option value="uncategorized">未分类</option></select></label>
<label>来源<select id="capture-source"><option value="manual">手动</option><option value="voice">语音</option><option value="web_clip">网页剪藏</option><option value="ai">AI</option><option value="import">导入</option></select></label>
</div>
<button type="submit">保存到捕获箱</button>
</form>
<p id="capture-status" class="status" aria-live="polite"></p>
<div id="captures" class="record-list"></div>
</section>

<section aria-labelledby="task-title">
<div class="section-heading">
<h2 id="task-title">任务</h2>
<span class="muted">今日 / 待处理 / 已完成</span>
</div>
<div class="task-group">
<h3>今日任务</h3>
<div id="today-tasks-list" class="record-list"></div>
</div>
<div class="task-group">
<h3>待处理任务</h3>
<div id="pending-tasks" class="record-list"></div>
</div>
<div class="task-group">
<h3>已完成任务</h3>
<div id="completed-tasks" class="record-list"></div>
</div>
</section>

<section aria-labelledby="review-title">
<div class="section-heading">
<h2 id="review-title">每日回顾</h2>
<span class="muted">收尾今天，准备明天</span>
</div>
<div class="review-columns">
<div><h3>今日完成</h3><div id="review-completed" class="compact-list"></div></div>
<div><h3>今日未完成</h3><div id="review-incomplete" class="compact-list"></div></div>
<div><h3>今日新增捕获</h3><div id="review-captures" class="compact-list"></div></div>
</div>
<form id="review-form">
<label for="tomorrow-goal">明日主线</label>
<textarea id="tomorrow-goal" rows="2" placeholder="写下明天最重要的一件事"></textarea>
<button type="submit">保存明日主线</button>
</form>
<p id="review-status" class="status" aria-live="polite"></p>
</section>

<section class="secondary-section" aria-labelledby="advisor-title">
<h2>AI参谋</h2>
<label for="ask">输入你的问题</label>
<textarea id="ask" placeholder="输入你的问题"></textarea>
<button id="advisor-button" type="button">分析</button>
<p id="reply"></p>
</section>

<section class="secondary-section" aria-labelledby="note-title">
<h2>知识库</h2>
<label for="note">记录研究、想法、方法</label>
<textarea id="note" placeholder="记录研究、想法、方法"></textarea>
<button id="note-button" type="button">保存</button>
<div id="notes"></div>
</section>

<section class="secondary-section" aria-labelledby="decision-title">
<h2>决策中心</h2>
<label for="decision">记录你的决定、理由、风险</label>
<textarea id="decision" placeholder="记录你的决定、理由、风险"></textarea>
<button id="decision-button" type="button">记录</button>
<div id="decisions"></div>
</section>
</main>
<dialog id="conversion-dialog" class="editor-dialog">
<form id="conversion-form" method="dialog">
<div class="section-heading"><h2>转换为任务</h2><button type="button" class="icon-button" data-close-dialog="conversion-dialog" aria-label="关闭">×</button></div>
<input type="hidden" id="conversion-capture-id">
<label for="conversion-title">任务标题</label>
<input id="conversion-title" type="text" required>
<label for="conversion-priority">优先级</label>
<select id="conversion-priority"><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select>
<label for="conversion-due-date">截止日期</label>
<input id="conversion-due-date" type="date">
<label class="checkbox-label"><input id="conversion-today" type="checkbox"> 加入今日任务</label>
<p id="conversion-status" class="status" aria-live="polite"></p>
<div class="dialog-actions"><button type="button" class="secondary-button" data-close-dialog="conversion-dialog">取消</button><button type="submit">确认转换</button></div>
</form>
</dialog>
<dialog id="task-dialog" class="editor-dialog">
<form id="task-form" method="dialog">
<div class="section-heading"><h2>编辑任务</h2><button type="button" class="icon-button" data-close-dialog="task-dialog" aria-label="关闭">×</button></div>
<input type="hidden" id="task-id">
<label for="task-title-input">任务标题</label>
<input id="task-title-input" type="text" required>
<label for="task-priority">优先级</label>
<select id="task-priority"><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select>
<label for="task-due-date">截止日期</label>
<input id="task-due-date" type="date">
<label for="task-status">状态</label>
<select id="task-status"><option value="todo">待开始</option><option value="in_progress">进行中</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select>
<label class="checkbox-label"><input id="task-today" type="checkbox"> 加入今日任务</label>
<p id="task-editor-status" class="status" aria-live="polite"></p>
<div class="dialog-actions"><button type="button" class="secondary-button" data-close-dialog="task-dialog">取消</button><button type="submit">保存修改</button></div>
</form>
</dialog>
<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
